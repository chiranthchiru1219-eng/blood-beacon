<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloodBeacon — Live Location</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 🔒 Admin Access Check -->
  <script>
    // If not logged in, redirect to login page
    if (sessionStorage.getItem("isAdmin") !== "true") {
      window.location.href = "login.html";
    }
  </script>

  <header>
    <img src="bloodbeacon-logo.jpeg" alt="BloodBeacon Logo" class="logo" />
    <!-- Optional Logout Button -->
    <button onclick="logout()" 
            style="background:#444;color:#fff;padding:6px 12px;
                   border:none;border-radius:8px;float:right;margin:10px;">
      Logout
    </button>
  </header>

  <div id="clock">⏱️ Loading time...</div>

  <div id="controls">
    <select id="bloodGroup">
      <option value="">Select Blood Group</option>
      <option value="A+">A+</option><option value="A-">A-</option>
      <option value="B+">B+</option><option value="B-">B-</option>
      <option value="O+">O+</option><option value="O-">O-</option>
      <option value="AB+">AB+</option><option value="AB-">AB-</option>
    </select>
    <button id="nearestBtn">Nearest Donors (≤100 m)</button>
    <button id="allBtn">Show All Donors</button>
    <button onclick="clearRoute()">❌ Clear Route</button>
  </div>

  <div id="msg"></div>

  <div id="container">
    <div id="map"></div>
    <div id="results"><p>Select a blood group and click a button.</p></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>

  <!-- 🔐 Logout Script -->
  <script>
    function logout() {
      sessionStorage.removeItem("isAdmin");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
